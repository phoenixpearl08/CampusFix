name: Deploy CampusFix Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend for GitHub Pages
        working-directory: frontend
        env:
          VITE_API_URL: https://campusfix-vnhn.onrender.com/api
        run: npm run build

      - name: Ensure .nojekyll in dist
        run: touch frontend/dist/.nojekyll

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
          commit-message: 'Deploy CampusFix production build to GitHub Pages'

      - name: Setup Pages (for Actions-based Pages deployment)
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages Artifact
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
